<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input id="input" type="text">
    <button id="check">Check capital</button>
    <h2 id="result"></h2>

    <script>

    let inputCap = document.getElementById('input');
    let button = document.getElementById('check');
    let result = document.getElementById('result');

    button.addEventListener('click',function(evt){
    let inputCapital = inputCap.value;
    let inputCapLower = inputCapital.toLowerCase();

        if(inputCapLower == "cairo" ){
            result.innerHTML = "the answer is correct";
        } else {
            result.innerHTML = "the answer is incorrect";
        }
    });
    </script>
</body>
</html>
