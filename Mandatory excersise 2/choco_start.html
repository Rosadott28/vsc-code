<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    
    <header id="header">
        <img id="headerImage">
    </header> 

    <div id="categoryButtons"></div>

    <div id="chocolateList"></div>

    <dialog id="chocoDialog">
        <img id="dialogImage">
        <h2 id="dialogName"></h2>
        <h3 id="dialogHeading"></h3>
        <p id="dialogPrice"></p>

        <button id="closeDialog">Close</button> <!--en button som lukker pop up-->
    </dialog>

    <script>

        //load the data from the server
        // dollartegn = Sett verdien av denne JavaScript-variabelen inn her, man kan bruke h2+djhf.jhdf + /h2, men dollartegn går fortere og simplere
        loadData();

        const closeDialog = document.getElementById("closeDialog");

        closeDialog.addEventListener("click", function() {
            document.getElementById("chocoDialog").close();
        });



        //----------------------------------
        async function loadData(category = "") {

            let url = "https://sukkergris.no/choco/jsonlist/";

            if (category != "") { //hvis kategorien er noe gjør dette
                url += "?category=" + category;
            }

            const response = await fetch(url);
            const data = await response.json();
        

            const categoryButtons = document.getElementById("categoryButtons");

        if (categoryButtons.innerHTML == "") {

                categoryButtons.innerHTML = `
                    <button data-category="">All</button>
                `;
            

                data.categories.forEach(function(category) {
                categoryButtons.innerHTML += `
                    <button data-category="${category}">
                        ${category}
                    </button>
                    `;
                });

            const buttons = document.querySelectorAll("#categoryButtons button"); //finn alle buttons som ligger i categoryButtons
                
            buttons.forEach(function(button) {

                 button.addEventListener("click", function() {

                    let selectedCategory = button.dataset.category;

                    loadData(selectedCategory);

                });
            });
        }

            const headerImage = document.getElementById("headerImage"); // henter heading
            headerImage.src = data.info.headImg;; // den setter bilde fra json som heading bilde 
            const chocolateList = document.getElementById("chocolateList"); 

            chocolateList.innerHTML = ""; //fjerner alt på skjermen

            data.chocodata.forEach(function(chocolate, index) { //index =tall

                 let smallImage = chocolate.image //vi må ha små bilder, så vi må gjøre det under for å hente ut de små bildene istedenfor css
                .replace("large", "small")
                .replace(".png", ".jpg");

                let imageURL = data.info.imgURL + smallImage;
                // data... er mappen bildene ligger i, imens smallImage er filnavnet vi lagde tidligere.

                chocolateList.innerHTML += ` 
                <div class="chocolate" data-index="${index}"> 
                <img class= "smallImage" src="${imageURL}">
                <h2>${chocolate.name}</h2>
                <h3>${chocolate.heading}</h3>
                <p>${chocolate.price} ,-</p>
                </div>
                `;
                // vi legger inn i en div pr sjokolade, i tillegg til tekst og bilde.
                // data-index = Den lagrer nummeret til sjokoladen direkte på HTML-elementet. eks sjokolade 1 → data-index="0" dette gjør vi for å vite hvilken sjokolade vi senere trykker på.
            
            });     

            const chocolates = document.querySelectorAll(".chocolate");//finner alle HTML som har class = chocolate

            chocolates.forEach(function(currentChoc){
                
                currentChoc.addEventListener("click", function(){

                    let index = currentChoc.dataset.index;
                    let chocolate = data.chocodata[index];
                    document.getElementById("dialogName").innerHTML = chocolate.name;
                    document.getElementById("dialogHeading").innerHTML = chocolate.heading;
                    document.getElementById("dialogPrice").innerHTML = "price: " + chocolate.price + ",-";
                    document.getElementById("dialogImage").src =
                    data.info.imgURL + chocolate.image; //det store bildet

                    document.getElementById("chocoDialog").showModal(); //åpne dialogboksen som et modalt vindu

                });
            });


            console.log(data); //the chocolate data
        }


    </script>
    <style>
        #headerImage {
            width: 100%;
            height: 33vh; /* betyr en 3del av høyden av skjermen*/
            object-fit: cover; /* gjør at bildet ikke blir stretched */
        }

        .chocolate {
            display:grid; /*vi lager grid for å putte info i etterpå*/

            grid-template-columns: 80px 1fr 60px;
            grid-template-rows: auto auto;
            /* 80px bildefelt + tekstfelt med resten (fraction) + 60px prisfelt*/

            border: 1px solid black;
        }

        .smallImage {
            width: 70px;
            height: 70px;
            object-fit: cover;

            grid-column: 1; /*vi vil ha bilde i plass 1 i grid*/
            grid-row: 1/3 ; /*gjør at bilde dekker begge radene som vist i oppg*/
        }

        .chocolate h2 {
            grid-column: 2;
            grid-row: 1;
            margin: 0;
        }

        .chocolate h3 {
            grid-column: 2;
            grid-row: 2;
            margin: 0;
        }

        .chocolate p {
            grid-column: 3;
            grid-row: 1 / 3;
            margin: 0;
        }

        #chocoDialog {
            width: 400px;
            max-width: 90%;
            padding: 20px;
        }

        #dialogImage {
            width: 100%;
            max-width: 300px;
            display: block;
            margin: 0 auto;
        }
    </style>
</body>

</html>
